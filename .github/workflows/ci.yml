name: CI

on:
  push:
    branches: [main]
  # PR 一律触发，不限 base 分支。
  # 原先写死 `branches: [main]`，导致**栈式 PR 完全不跑 CI**——目标是中间分支的
  # PR（如 A→B→main 的 A→B）既不触发 push 也不触发 pull_request，等于无门合并。
  # push 仍只限 main：中间分支的每次 push 都跑一遍纯属浪费 runner，
  # PR 事件已覆盖「合并前必须验证」这一真实需求。
  pull_request:

# Cancel in-progress runs of this workflow for the same ref. Saves runner
# minutes when a PR is force-pushed or a new commit lands quickly.
# main runs (push) are never cancelled because main pushes are rare and the
# audit trail matters; PR re-pushes are.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Sqlite-backed build + tests. This is the back-compat baseline (also runs on
  # macOS self-hosted runners when CI_RUNNER_LABELS is set). The canonical
  # Phase 1A acceptance path is the `test-postgres` job below — see plan v7.3
  # §2.1 P0-B. The PG job depends on this one (needs: build-and-test) so we
  # still gate compile + sqlite suite first.
  build-and-test:
    name: Build & tests (sqlite fallback)
    runs-on: ${{ vars.CI_RUNNER_LABELS && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # No `cache: npm` — see commit fadcec4: setup-node npm caching is
          # toxic on the macOS self-hosted runner this job can target via
          # CI_RUNNER_LABELS (multi-GB cache uploads, ~10min overhead).
      - run: npm ci
      - name: Build core packages
        # schema-dsl is required by src/storage/dsl-migrations-runner.ts;
        # without its dist, tsc -b tsconfig.src.json cannot resolve
        # `@wontlost-ltd/schema-dsl`. Pre-existing CI gap exposed when
        # local builds happen to work via the root tsconfig.json references.
        run: npx tsc -b packages/contracts/tsconfig.json packages/kernel/tsconfig.json packages/data-plane/tsconfig.json packages/sync-engine/tsconfig.json packages/design-tokens/tsconfig.json packages/schema-dsl/tsconfig.json packages/adapter-web/tsconfig.json packages/adapter-tauri/tsconfig.json packages/adapter-react-native/tsconfig.json
      - name: Build main source
        run: npx tsc -b tsconfig.src.json
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:ops
      - name: Field-encryption coverage lint (P1-H)
        run: npm run lint:field-encryption
      - name: Security audit
        run: npm audit --audit-level=high

  contract-and-kernel:
    runs-on: ${{ vars.CI_RUNNER_LABELS && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          # No `cache: npm` — same rationale as build-and-test (see commit fadcec4).
      - run: npm ci
      - name: Build core packages
        # schema-dsl is required by src/storage/dsl-migrations-runner.ts;
        # without its dist, tsc -b tsconfig.src.json cannot resolve
        # `@wontlost-ltd/schema-dsl`. Pre-existing CI gap exposed when
        # local builds happen to work via the root tsconfig.json references.
        run: npx tsc -b packages/contracts/tsconfig.json packages/kernel/tsconfig.json packages/data-plane/tsconfig.json packages/sync-engine/tsconfig.json packages/design-tokens/tsconfig.json packages/schema-dsl/tsconfig.json packages/adapter-web/tsconfig.json packages/adapter-tauri/tsconfig.json packages/adapter-react-native/tsconfig.json
      - name: Build main source
        run: npx tsc -b tsconfig.src.json
      - run: npm run build
      - name: Package tests (kernel / data-plane / contracts / sync-engine)
        run: npm run test:packages
      - name: Contract tests
        run: npm run test:contract
      # 审计 #410b：ripgrep 是内核纯度门的**外部依赖**，此前从未声明也从未安装 ——
      # 而门用 `|| true` 把「rg: command not found」一并吞掉，于是**在没有扫描器的
      # 情况下打印 ✓ 并退出 0**（本地 PATH 剥离实测复现：4 行 command not found + RC=0）。
      # 门改成 fail-closed 后这条缺失立刻暴露，故这里把依赖显式装上。
      - name: Install ripgrep (内核纯度门的显式依赖)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          rg --version
      - name: Kernel purity — forbidden imports
        run: npm run check:forbidden-imports
      - name: schema-dsl parity (simple migrations)
        run: npm run test:schema-dsl-parity:simple
      - name: schema-dsl parity (raw migrations)
        run: npm run test:schema-dsl-parity:raw
      - name: schema-dsl parity (desktop sqlite-rust)
        run: npm run test:schema-dsl-parity:desktop

  # GA aggregate gate. Covers §8 #1-28 artifact presence + cross-cutting
  # lints via the ga:check script.
  #
  # NOTE (audit P3): this comment previously claimed ga:check "mirrors
  # what `npm run test:golden` runs at the end of its chain" — that was
  # false. test:golden ends with `... && check:licenses && check:db-access
  # && check:sql-layering`, and the latter two had ZERO references anywhere
  # in .github/. A PR could add raw SQL to a route layer, or an
  # unclassified DB sink, and CI would stay green — which is exactly how
  # the broken `onboarding-v2.ts` INSERT survived. They now run explicitly
  # as their own steps below. In CI we run ga:check WITHOUT
  # --require-siblings because OS-only checkouts can't pull the three
  # sibling repos; their lints run in their own CI workflows.
  #
  # Some of the underlying steps (check:forbidden-imports,
  # lint:field-encryption) are also executed by the build-and-test
  # and contract-and-kernel jobs above. That's intentional: ga:check
  # is the GA-gate contract and must remain self-contained — running
  # it gives a clean "all GA blockers green or not" signal independent
  # of which other CI job happened to also exercise the underlying
  # script. The ~2s overhead is negligible vs. the audit clarity.
  ga-check:
    name: GA aggregate gate (§8 #1-28 + cross-cutting lints)
    runs-on: ${{ vars.CI_RUNNER_LABELS && fromJSON(vars.CI_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      # 审计 #410b：ga:check 内部也跑内核纯度门（os.check-forbidden-imports），
      # 同样需要 ripgrep 这个显式依赖。
      - name: Install ripgrep (内核纯度门的显式依赖)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          fi
          rg --version
      - name: Build core packages
        run: npx tsc -b packages/contracts/tsconfig.json packages/kernel/tsconfig.json packages/data-plane/tsconfig.json packages/sync-engine/tsconfig.json packages/design-tokens/tsconfig.json packages/schema-dsl/tsconfig.json packages/adapter-web/tsconfig.json packages/adapter-tauri/tsconfig.json packages/adapter-react-native/tsconfig.json
      - name: Build main source
        run: npx tsc -b tsconfig.src.json
      - run: npm run build
      # ⚠️ apps/mobile **不在**根 package.json 的 workspaces 里（RN 0.76 + Expo 52
      # 带 React 18.3.1，与根上的 React 19 冲突，提升到根会拖垮 apps/web），
      # 所以根 `npm ci` 不会装它的依赖。而 ga:check 的 mobile.typecheck /
      # mobile.test 要在该目录里跑 tsc / jest —— CI 上直接 exit 127
      # （command not found）。本地之所以「没问题」，只是因为开发机上留着
      # 一份旧的 apps/mobile/node_modules。
      #
      # 故显式单独安装。--ignore-scripts 与其余三处 npm ci 保持一致（PR #352）。
      - name: Install apps/mobile deps（不在根 workspaces，见上）
        run: npm ci --ignore-scripts --prefix apps/mobile
      - name: GA blocker artifact audit (§8 #1-28)
        # Standalone signal: even if ga:check below changes its
        # composition, this line stays a stable "did we ship the
        # §8 artifacts" indicator. CI parsers downstream can grep it.
        run: npm run audit:ga-blockers
      - name: ga:check — aggregate GA gate
        # --out=ga-check.json keeps stdout clean of the npm banner
        # so the structured report file can be uploaded as an artifact
        # for human inspection on failure.
        # Default mode (non-strict): missing sibling repos are skipped
        # cleanly. Release CI uses CHRONO_GA_REQUIRE_SIBLINGS=1; that's
        # not appropriate here because OS-only checkouts don't fetch
        # the sibling repos.
        run: node dist/scripts/ga-check.js --out=ga-check.json
      # These are the tail of `npm run test:golden` but were never
      # wired into CI (audit P3). All pass today, so adding them is
      # non-breaking; they exist to keep it that way.
      - name: check:db-access — DB sink classification ratchet
        run: npm run check:db-access
      - name: check:sql-layering — no raw SQL outside executors
        run: npm run check:sql-layering
      # 审计 #413：check:licenses 在 test:golden 尾链里，但此前 CI 完全不跑
      # （上面那条注释写"These two"就是漏了它）。ADR-0022 双轨许可
      # （MIT 库 / AGPL 服务端）漂移是**法律面**错误，开源发布后不可逆。
      - name: check:licenses — ADR-0022 dual-track license boundary
        run: npm run check:licenses
      # 审计 #410/#430：门禁自身必须有自测，否则门逻辑退化无人发现
      # （本轮出缺陷的三个门恰好全部无自测，门永远打印 ✓）。
      - name: 内核纯度门自测（门禁自身的回归保护）
        run: bash scripts/check-forbidden-imports.selftest.sh
      - name: Upload ga:check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga-check-report
          path: ga-check.json
          retention-days: 30

  # Pinned to GitHub-hosted Ubuntu: docker/setup-buildx-action requires
  # buildkit, which isn't available on a macOS self-hosted runner (only
  # podman, which doesn't speak the buildkit gRPC protocol the action uses).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: chrono-synth-os:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 冒烟启动：仅「构建成功」不足以证明镜像可用。npm ci 用了 --ignore-scripts
      # （见 Dockerfile 注释），若将来新增一个真的依赖安装脚本产出产物的原生生产
      # 依赖，镜像仍能构建成功，却会在**运行时**才崩——那时已经进了部署。
      # 这一步把该类故障拦在 CI。
      #
      # 两个环境变量都是必需的：缺任一都会命中应用自身的 fail-closed 配置门
      # （分别是 JWT/加密密钥校验与生产环境禁止同步模拟），容器直接退出 1。
      - name: Boot smoke test (image must actually run)
        run: |
          set -euo pipefail
          docker run -d --name chrono-smoke -p 3000:3000 \
            -e CHRONO_ALLOW_INSECURE_PRODUCTION=true \
            -e CHRONO_QUEUE_ENABLED=true \
            -e CHRONO_DB_PATH=/app/data/smoke.db \
            chrono-synth-os:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null; then
              echo "" && echo "✓ 镜像启动并通过 /healthz"
              docker rm -f chrono-smoke >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "✗ 镜像 60s 内未通过 /healthz —— 容器日志："
          docker logs chrono-smoke 2>&1 | tail -50
          docker rm -f chrono-smoke >/dev/null
          exit 1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chrono-synth-os:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  # PostgreSQL is the canonical Phase 1A acceptance path (plan v7.3 §2.1 P0-B).
  # The `build-and-test` job above runs the same npm scripts on sqlite as a
  # back-compat baseline; the truth-of-record for "287/307 integration tests
  # pass" is this job. Local validation 2026-05-21: 307/307 passed against
  # pgvector/pgvector:pg17.
  #
  # Pinned to GitHub-hosted Ubuntu: workflow `services:` blocks are a
  # Linux-only Actions feature (the runner orchestrates them via Docker).
  # macOS runners don't support services and would skip the postgres
  # container entirely, leading to confusing connection refused errors.
  test-postgres:
    name: Tests (PostgreSQL — canonical Phase 1A path)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    services:
      postgres:
        # pgvector/pgvector:pg17 = vanilla Postgres 17 + the `vector`
        # extension preinstalled (and pre-allowed). The plain
        # `postgres:17-alpine` image doesn't ship the .so, so v071's
        # `CREATE EXTENSION vector` fails with "not available".
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: chrono_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Set at job scope so every step (typecheck/build/test/test:ops) inherits.
      # PG-only tests detect TEST_POSTGRES_URL and run; sqlite-only fallback is
      # invoked only when this var is absent (see src/test/integration/postgres.test.ts).
      TEST_POSTGRES_URL: postgres://test:test@localhost:5432/chrono_test
      CHRONO_DB_DRIVER: postgres
      CHRONO_DB_CONNECTION_STRING: postgres://test:test@localhost:5432/chrono_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build core packages
        # schema-dsl is required by src/storage/dsl-migrations-runner.ts;
        # without its dist, tsc -b tsconfig.src.json cannot resolve
        # `@wontlost-ltd/schema-dsl`. Pre-existing CI gap exposed when
        # local builds happen to work via the root tsconfig.json references.
        run: npx tsc -b packages/contracts/tsconfig.json packages/kernel/tsconfig.json packages/data-plane/tsconfig.json packages/sync-engine/tsconfig.json packages/design-tokens/tsconfig.json packages/schema-dsl/tsconfig.json packages/adapter-web/tsconfig.json packages/adapter-tauri/tsconfig.json packages/adapter-react-native/tsconfig.json
      - name: Build main source
        run: npx tsc -b tsconfig.src.json
      - run: npm run build
      - run: npm run typecheck
      - name: Run full test suite (PostgreSQL)
        # Equivalent to `npm run test` but with PG env. Includes 10 PG-gated
        # integration tests that are skipped in the sqlite job above.
        run: npm run test
      - run: npm run test:ops

  # a11y E2E —— 此前**没有任何 job 跑 Playwright/axe**（apps/web/playwright.config.ts
  # 的注释提到的 .github/workflows/e2e.yml 从未存在过），导致：
  #   1. dark 主题品牌色作文本对比度仅 2.83 的真实违规长期无人发现；
  #   2. @axe-core/playwright 升级（引擎跨 minor 会新增规则）不会被任何门拦截。
  #
  # 只跑 chromium：firefox/webkit 需另装浏览器二进制，而 axe 的规则判定与浏览器
  # 内核无关，多跑两个内核只换来 3 倍时长和额外的 flaky 面。
  #
  # 三个套件全收，含覆盖 18 条路由（登录后页面在内）的 axe-routes.spec.ts。
  #
  # 一度想排除 axe-routes——它靠 waitForTimeout(200) 等渲染，源码注释自述
  # 「per-page run is noisy with skeleton states」，且首次并跑多套件时确实见过
  # 一次 /growth 偶发假阳。但单独连跑 8 轮（3+5）**全绿**，说明那次是并跑时的
  # 时序竞争而非套件自身不稳；且 playwright.config.ts 在 CI 下已配 retries: 2。
  #
  # 排除它的代价更大：axe-a11y.spec.ts 只访问 login/register/billing 三页，
  # 本 PR 37 处替换里仅 4 处落在其中——其余 33 处（Dashboard/Marketplace/
  # TrustBadge…）将完全无 axe 覆盖，等于门形同虚设。
  a11y-e2e:
    name: a11y E2E (axe, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # apps/web 直接 import @chrono/contracts 与 @chrono/sync-engine 的**产物**。
      # 干净检出时这些 dist/ 不存在，vite dev server 会报
      # 「Failed to resolve import "@chrono/contracts"」，页面直接白屏，
      # axe 随即把整页判为违规——本地因为 dist 早已存在而看不到，是纯 CI-only 故障。
      # 只建这两个：grep 确认 apps/web 仅 import @chrono/contracts 与
      # @chrono/sync-engine，而后者只依赖前者（tsc -b 会自动按引用顺序构建）。
      - name: Build workspace packages consumed by apps/web
        run: npx tsc -b packages/contracts/tsconfig.json packages/sync-engine/tsconfig.json
      # 缓存浏览器二进制：install 步骤实测会偶发挂死（一次跑了 14.5 分钟
      # 无任何输出，直接把 15 分钟的 job 预算耗光并被取消，测试一条没跑）。
      # 命中缓存时可完全跳过下载。key 绑 playwright 版本，升级自动失效。
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - name: Install Playwright chromium
        working-directory: apps/web
        # 步骤级超时：宁可这一步明确失败，也不要静默拖垮整个 job——
        # 后者的表象是「a11y 门被 cancel」，很容易被误读成测试有问题。
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium
      - name: Run axe a11y suite
        working-directory: apps/web
        timeout-minutes: 8
        run: npx playwright test --project=chromium e2e/axe-a11y.spec.ts e2e/accessibility/
      # ⚠️ 审计 #432：16 个 E2E 套件此前 CI 只跑 4 个（axe + accessibility/），
      # auth / billing / onboarding / workforce-console / feature-flag-kill-switch
      # 等 **12 个功能回归全部不跑**。这与「CI 无任何 job 跑 Playwright」的历史
      # 缺口同型 —— 现在有了 Playwright job，反而更容易让人误以为 E2E 已被覆盖。
      #
      # 本地逐个实跑确认全绿（共 64 条）：a11y 7 / auth 7 / billing 7 /
      # feature-flag-kill-switch 1 / forms-interaction 18 / i18n 3 /
      # navigation 7 / onboarding 4 / simulation 11 / workforce-console 6。
      # 它们都用 mock 数据，不需要后端。
      #
      # 明确排除两个（实测在此环境必红，不是本次要修的东西）：
      #   - e2e/podman/  ：需要 podman 起真实容器；
      #   - e2e/visual-regression/：需要预先生成的基线快照。
      - name: Run functional e2e suites（审计 #432：此前 12 个套件从不运行）
        working-directory: apps/web
        timeout-minutes: 10
        run: |
          npx playwright test --project=chromium \
            e2e/a11y.spec.ts \
            e2e/auth.spec.ts \
            e2e/billing.spec.ts \
            e2e/feature-flag-kill-switch.spec.ts \
            e2e/forms-interaction.spec.ts \
            e2e/i18n.spec.ts \
            e2e/navigation.spec.ts \
            e2e/onboarding.spec.ts \
            e2e/simulation.spec.ts \
            e2e/workforce-console.spec.ts
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
