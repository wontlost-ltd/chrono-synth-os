# DEPRECATED: use chrono-synth-deploy/k8s/ instead
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrono-synth-os
  namespace: chrono-synth
  labels:
    app.kubernetes.io/name: chrono-synth-os
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chrono-synth-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrono-synth-os
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: chrono-synth-os
          image: chrono-synth-os:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: chrono-synth-config
          env:
            # ⚠️ 审计 P2：`REPLICA_COUNT` 被两处安全守卫读取
            #   - app.ts:221        SQLite 多写入器阻断
            #   - rate-limit.ts:91  多副本必须配 Redis 分布式限流
            # 但它此前**在任何 k8s manifest / configmap / Dockerfile / compose
            # 里都没有设置** —— 两道守卫在部署下完全失效（恒不触发）。
            # 必须与上面的 `replicas: 2` 保持一致；改副本数时一并改这里。
            - name: REPLICA_COUNT
              value: "2"
            - name: CHRONO_OBSERVABILITY_WORKER_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chrono-synth-data
        - name: tmp
          emptyDir: {}
