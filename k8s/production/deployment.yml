apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrono-synth-os
  namespace: chrono-synth-prod
  labels:
    app.kubernetes.io/name: chrono-synth-os
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chrono-synth-os
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/prometheus"
        prometheus.io/port: "3000"
      labels:
        app.kubernetes.io/name: chrono-synth-os
        environment: production
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chrono-synth-os
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: chrono-synth-os
      containers:
        - name: chrono-synth-os
          image: chrono-synth-os:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            # ⚠️ 审计 P2：`REPLICA_COUNT` 被两处安全守卫读取
            #   - app.ts:221        SQLite 多写入器阻断
            #   - rate-limit.ts:91  多副本必须配 Redis 分布式限流
            # 但它此前**在任何 k8s manifest / configmap / Dockerfile / compose
            # 里都没有设置** —— 两道守卫在生产部署下完全失效（恒不触发）。
            # 必须与上面的 `replicas: 3` 保持一致；改副本数时一并改这里。
            - name: REPLICA_COUNT
              value: "3"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: chrono-synth-prod-config
            - secretRef:
                name: chrono-synth-prod-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
